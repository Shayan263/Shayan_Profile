name: Root Preview Build

on:
  push:
    branches:
      - root
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout root
        uses: actions/checkout@v4

      - name: Prepare preview artifact
        run: |
          mkdir -p preview-site
          rsync -av --exclude='.git' --exclude='preview-site' ./ preview-site/

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: shayan-profile-root-preview
          path: preview-site/
          if-no-files-found: error
          retention-days: 7

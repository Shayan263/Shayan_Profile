name: Web Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for committed credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md'             '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})' .; then
            echo "Potential credential material detected."
            exit 1
          fi

      - name: Check source for plain HTTP
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'http://[^/]' .; then
            echo "Plain HTTP URL detected."
            exit 1
          fi

      - name: Verify browser security controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Content-Security-Policy' index.html
          grep -q 'Content-Security-Policy' admin.html
          grep -q 'strict-origin-when-cross-origin' index.html
          grep -q 'strict-origin-when-cross-origin' admin.html
          grep -q "window.top !== window.self" admin.html
